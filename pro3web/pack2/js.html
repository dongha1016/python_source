<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    ** 자바 스크립트 : 클라이언트 사이드 스크립트 ** <br>
    <script>
    window.document.write("환영합니다. JS 세상"); 
    // 브라우저 화면으로 출력
    // 자바 스크립트는 문장이 끝나면 ';' 주는 버릇들이기(안줘도 무방함)
    console.log("개발자를 위해 표준 출력장치로 출력")
    // 개발자들이 코드가 정상적인지 확인하기 위해 브라우저에서 우클릭(검사) - Console에서 확인
    document.write("<h2>브라우저에 문자열 출력</h2>")
    </script>
    <!-- 스크립트 안에 써줘야 자바 스크립트이다 -->
    다시 html로 나옴<br>
    <script>
        document.write("여기는 자바스크립트");
        let a = 10
        let b = a + 10;
        document.write("<br>b는 ", b);
    </script>
</body>
</html>
